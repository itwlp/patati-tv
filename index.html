<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Patati de hoje</title>
<style>
  :root{--bg:#fff8e7;--surface:#ffffff;--ink:#1d1b2b;--muted:#66637a;--line:#e3dfcf;--accent:#d93a2b;--sun:#f2b705;--teal:#167c78}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13121a;--surface:#1d1b26;--ink:#efedf7;--muted:#a29fb6;--line:#312e3d;--accent:#ff6b5b;--sun:#f5c842;--teal:#4cc4bd}}
  :root[data-theme="dark"]{--bg:#13121a;--surface:#1d1b26;--ink:#efedf7;--muted:#a29fb6;--line:#312e3d;--accent:#ff6b5b;--sun:#f5c842;--teal:#4cc4bd}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,-apple-system,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
  header{display:flex;align-items:center;gap:12px}
  header .ico{font-size:2.4rem;line-height:1}
  h1{margin:0;font-size:1.6rem;line-height:1.15}
  .sub{margin:2px 0 0;color:var(--muted);font-size:.95rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .play{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:1.25rem;padding:18px 20px;border-radius:999px;background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(217,58,43,.25)}
  .play:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
  ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
  ol li a{color:var(--ink);text-decoration:none;font-weight:700}
  ol li a:hover{text-decoration:underline}
  .dur{color:var(--muted);font-weight:400;white-space:nowrap}
  .meta{color:var(--muted);font-size:.9rem;margin:0}
  .dia{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
  .dia:first-child{border-top:0;padding-top:0}
  .dia a.p{font-weight:700;color:var(--teal);text-decoration:none}
  .warn{background:#fde8e5;color:#7a1f16;border-radius:12px;padding:10px 14px;font-size:.92rem}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3a1f1d;color:#ffb9b0}}
  details summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ico" aria-hidden="true">🤡</div>
    <div>
      <h1 id="titulo">Patati de hoje</h1>
      <p class="sub" id="sub">Carregando o plano…</p>
    </div>
  </header>
  <div id="aviso" class="warn" hidden></div>
  <section class="card" id="hoje" hidden>
    <a class="play" id="tocar" href="#" target="_blank" rel="noopener">▶ Tocar o pacote de hoje</a>
    <ol id="lista"></ol>
    <p class="meta">Abra no app YouTube do celular e toque em transmitir para a TV. Desligue a reprodução automática no player para a fila parar no fim.</p>
  </section>
  <section class="card" id="proximos" hidden>
    <details>
      <summary>Próximos dias</summary>
      <div id="dias" style="margin-top:12px"></div>
    </details>
  </section>
  <p class="meta" id="rodape"></p>
</div>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const chave = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const nome = iso => { const p = iso.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]).toLocaleDateString('pt-BR', {weekday:'long'}); };
  const dm = iso => iso.slice(8) + '/' + iso.slice(5,7);
  const pacote = d => 'https://www.youtube.com/watch_videos?video_ids=' + d.videos.map(v => encodeURIComponent(v.id)).join(',');
  const curto = t => String(t).replace(/^Patati Patatá\s*[-–]?\s*/, '');
  fetch('plano.json?v=' + Date.now(), {cache:'no-store'}).then(r => r.json()).then(p => {
    const dias = (p.dias || []).filter(d => d.videos && d.videos.length);
    if(!dias.length){ $('#sub').textContent = 'O plano está vazio. Peça para atualizar.'; return; }
    const hoje = chave(new Date());
    const futuros = dias.filter(d => d.data >= hoje);
    const d0 = futuros[0] || dias[dias.length-1];
    const ehHoje = d0.data === hoje;
    $('#titulo').textContent = ehHoje ? 'Patati de hoje' : 'Patati de ' + nome(d0.data);
    $('#sub').textContent = nome(d0.data) + ', ' + dm(d0.data) + ' · ' + d0.videos.length + ' vídeos · ' + d0.total_min + ' min';
    $('#tocar').href = pacote(d0);
    $('#tocar').textContent = '▶ Tocar o pacote de ' + (ehHoje ? 'hoje' : nome(d0.data));
    $('#lista').innerHTML = d0.videos.map(v => `<li><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(curto(v.title))}</a> <span class="dur">${esc(v.duracao)}</span></li>`).join('');
    $('#hoje').hidden = false;
    const resto = futuros.slice(1);
    if(resto.length){
      $('#dias').innerHTML = resto.map(d => `<div class="dia"><a class="p" href="${esc(pacote(d))}" target="_blank" rel="noopener">▶ Pacote de ${esc(nome(d.data))} (${esc(dm(d.data))}) · ${d.total_min} min</a><p class="meta">${d.videos.map(v => esc(curto(v.title))).join(' · ')}</p></div>`).join('');
      $('#proximos').hidden = false;
    }
    const ultimo = dias[dias.length-1].data;
    if(ultimo < hoje){ $('#aviso').textContent = 'O plano acabou em ' + dm(ultimo) + '. Ele é renovado toda semana; se ficou parado, o notebook estava desligado.'; $('#aviso').hidden = false; }
    $('#rodape').textContent = 'Plano gerado em ' + String(p.geradoEm || '').replace('T', ' ').slice(0, 16) + ' · meta ' + (p.metaMin || 60) + ' min por dia, vídeos de ' + (p.faixa || '10-20 min') + '.';
  }).catch(() => { $('#sub').textContent = 'Não consegui carregar o plano. Confira a internet e recarregue.'; });
})();
</script>
</body>
</html>
